[project]
name = "alignment-rollout-server"
version = "0.1.0"
description = "Separate GRPO trainer and vLLM NCCL rollout environment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm==0.19.1",
    "torch==2.10.0",
    "transformers==4.57.6",
    "accelerate==1.6.0",
    "wandb==0.22.3",
    "math-verify[antlr4-13-2]==0.7.0",
    "pylatexenc==2.10",
    "pytest==8.3.5",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
